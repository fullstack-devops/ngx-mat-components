<fs-nav-frame [navFrameConfig]="navFrameConfig" [sizing]="sizing">
  <fs-nav-frame-toolbar>
    <fs-nav-frame-toolbar-start>Current App Title</fs-nav-frame-toolbar-start>

    <fs-nav-frame-toolbar-center>
      <button mat-icon-button>
        <i-lucide [img]="CircleQuestionMarkIcon" class="my-icon"></i-lucide>
      </button>
      <button mat-icon-button matBadge="3">
        <i-lucide [img]="NewspaperIcon" class="my-icon"></i-lucide>
      </button>
      <button mat-icon-button>
        <i-lucide [img]="CogIcon" class="my-icon"></i-lucide>
      </button>
    </fs-nav-frame-toolbar-center>

    <fs-nav-frame-toolbar-end style="gap: 1rem">
      <mat-form-field appearance="outline" class="dense-search">
        <mat-label>Search</mat-label>
        <input matInput placeholder="Searching..." />
      </mat-form-field>

      <!-- Theme switcher -->
      <fs-theme-menu>
        <i-lucide [img]="PaintBucketIcon" class="my-icon"></i-lucide>
      </fs-theme-menu>
    </fs-nav-frame-toolbar-end>
  </fs-nav-frame-toolbar>

  <fs-nav-frame-sidebar>
    @for (route of navRoutes; track route.title) {
      <fs-nav-frame-sidebar-item [routerLink]="route.path" [label]="route.title">
        <span-lucide [img]="route.icon" class="my-icon"></span-lucide>
        <span>{{ route.title }}</span>
      </fs-nav-frame-sidebar-item>
    }
  </fs-nav-frame-sidebar>

  <fs-nav-user-profile>
    @if (userProfile(); as user) {
    <ng-container fs-nav-user-profile-name>{{ user.name }}</ng-container>
    <ng-container fs-nav-user-profile-subname>{{ user.subname }}</ng-container>
    }

    <fs-nav-user-profile-actions>
      <button mat-icon-button aria-label="Edit profile" title="Edit profile">
        <i-lucide [img]="UserPenIcon" class="my-icon"></i-lucide>
      </button>
      <button mat-icon-button aria-label="Logout" title="Logout">
        <i-lucide [img]="LogOutIcon" class="my-icon"></i-lucide>
      </button>
    </fs-nav-user-profile-actions>
  </fs-nav-user-profile>

  <fs-nav-frame-content>
    <router-outlet></router-outlet>
  </fs-nav-frame-content>
</fs-nav-frame>
